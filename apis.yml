aid: infact
name: InFact
description: 'InFact (InFact UK Ltd, trading as Infact — Solutions in public health) builds software for
  communicable-disease control and public-health service delivery. Founded in 2003 by Dr Chakib Kara-Zaitri
  and Bob Hamilton, the company''s flagship product HPZone is an integrated suite for infectious-disease
  control built on two decades of frontline work with the national health services of the United Kingdom
  and the Netherlands: HPCore for case, contact and outbreak management with decision-support protocols
  and enquiry handling, EpiQ for epidemiological questionnaires, and HPInsight for surveillance dashboards,
  reporting and modelling. A second product line, Ampara (the successor to SHDirect), covers the clinic
  patient journey from triage through consultation, diagnostics, prescribing and follow-up. InFact is
  a Silver Industry Partner of openEHR International. HPZone exposes a credential-gated GraphQL API over
  cases, contacts, situations, enquiries, actions and contexts; the API exists and is in production use
  by national public-health bodies, but InFact publishes no public developer portal, reference or machine-readable
  contract.'
