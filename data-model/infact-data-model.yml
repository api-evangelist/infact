relationships:
- from: Cases
  to: Situations
  type: belongs_to
  via: Situation
  confidence: medium
  evidence: Cases carries a Situation field; HPZone documentation describes situations as the umbrella
    under which cases are managed.
- from: Contacts
  to: Cases
  type: belongs_to
  via: Case_number / index-case fields
  confidence: medium
  evidence: Contacts carries Additional_comments_on_the_nature_of_the_contact_with_index_case and case-manager
    identifiers, indicating an index-case association.
- from: Actions
  to: Cases
  type: belongs_to
  via: case/situation reference
  confidence: low
  evidence: Actions is documented as a work item in the same query surface; the joining field is not present
    in the published field catalogue.
relationship_note: HPZone publishes no schema document, so relationships below are read ONLY from identifier
  fields that appear in the documented field catalogue. They are structural inferences from field names,
  not declared associations; confidence is recorded per row.
conventions:
  query_roots: lower-case plural (cases, contacts, situations, enquiries, actions, contexts)
  field_names: Sentence_case_with_underscores; a human-readable label is published alongside each field
  collection_envelope: '{ items { ... }, totalCount }'
  multilingual_fields: A number of Cases/Contacts fields are named in Dutch (e.g. Hartaandoening, Aanvullende_informatie_over_de_melder),
    reflecting per-deployment schema extension by the national customer rather than a fixed product schema.
