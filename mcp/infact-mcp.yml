summary: InFact ships no MCP server, hosted or local, and no third party has published one for HPZone.
  The tools below are a DERIVED candidate surface only — a sketch of what an MCP server over the documented
  GraphQL query roots would expose. Nothing here is callable and no MCPServer pointer is wired into apis.yml.
blockers:
- The API is credential-gated (client_credentials issued by InFact per customer) with no self-service
  signup, so a public MCP server could not be anonymous.
- The extended scope returns directly-identifying and special-category health data, which makes an agent-facing
  surface a data-protection decision before it is an engineering one.
- The endpoint is served on non-standard TLS port 8899, which many MCP client environments cannot reach.
